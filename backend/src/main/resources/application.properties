spring.application.name=campussync-backend

spring.datasource.url=jdbc:mysql://localhost:3307/campussync
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:CampusSyncDevelopmentJwtSecretKey2026Minimum32CharactersSecure}
jwt.expiration=86400000

logging.level.org.springframework.security=TRACE

# Organizer activation
campussync.activation-url=https://campussync.local/organizer/activate

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Mailpit - Local email testing
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

campussync.password-reset-url=http://localhost:3000/#/reset-password